<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いっとく</title>
<meta name="description" content="話すだけでToDoが入るリスト。日付や時間も聞きとります">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="title">いっとく</h1>
    <p class="summary" id="summary"></p>
  </header>

  <div class="empty" id="empty" hidden>
    <p class="empty-main">やることを話してください</p>
    <p class="empty-sub">下のマイクを押して、たとえば</p>
    <p class="empty-example">「明日の3時に歯医者、牛乳買う」</p>
    <p class="empty-sub">と言うと、2つに分けて入ります。</p>
  </div>

  <section class="list" id="list"></section>

  <section class="done-area" id="doneArea" hidden>
    <div class="done-head">
      <button class="done-toggle" id="doneToggle" type="button" aria-expanded="false">
        <span id="doneLabel">終わったもの</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="text-btn" id="clearDone" type="button">まとめて消す</button>
    </div>
    <ul class="items done-items" id="doneList" hidden></ul>
  </section>
</main>

<div class="dock" id="dock">
  <p class="heard" id="heard" hidden></p>
  <form class="type-form" id="typeForm" hidden>
    <input id="typeInput" type="text" enterkeyhint="done" autocomplete="off" placeholder="例: 金曜までにレポート出す">
    <button type="submit">入れる</button>
  </form>
  <div class="dock-row">
    <button class="side-btn" id="typeBtn" type="button" aria-label="文字で入れる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h0M10 10h0M13 10h0M16 10h0M8 14h8"/></svg>
    </button>
    <button class="mic" id="micBtn" type="button" aria-label="話して入れる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <span class="side-btn ghost" aria-hidden="true"></span>
  </div>
  <p class="hint" id="hint">押して話す</p>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button class="toast-btn" id="toastBtn" type="button" hidden>元に戻す</button>
</div>

<dialog class="sheet" id="editDialog">
  <form method="dialog" id="editForm">
    <label class="field">
      <span>やること</span>
      <input id="editText" type="text" autocomplete="off">
    </label>
    <div class="field-row">
      <label class="field">
        <span>日にち</span>
        <input id="editDate" type="date">
      </label>
      <label class="field">
        <span>時間</span>
        <input id="editTime" type="time">
      </label>
    </div>
    <button class="text-btn small" id="clearWhen" type="button">日時をなしにする</button>
    <div class="sheet-actions">
      <button class="danger-btn" id="deleteBtn" type="button">消す</button>
      <span class="spacer"></span>
      <button class="plain-btn" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="main-btn" id="saveBtn" value="save" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
